<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐飲業務 - Food Service</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&display=swap" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/catering.css">
</head>

<body>
  <!-- header -->
  <div id="header"></div>

  <main class="main-content">
    <!-- Hero Banner -->
    <div class="hero-banner catering__banner">
      <h1 class="hero-banner__title">Food Service</h1>
      <p class="hero-banner__subtitle">餐飲業務</p>
    </div>

    <!-- Introduction -->
    <section class="catering-intro">
      <div class="catering-intro__container">
        <h2 class="catering-intro__title">專業餐飲解決方案</h2>
        <p class="catering-intro__text">
          味好美為全球餐飲業者提供最優質的香料與調味方案。<br>
          無論是星級飯店、連鎖餐廳還是特色小吃，我們都能滿足您的需求。
        </p>
      </div>
    </section>

    <!-- Categories -->
    <section class="catering-categories">
      <div class="catering-categories__container">
        <!-- Category 1: Bagged Spices -->
        <div class="catering-card">
          <div class="catering-card__image">
            <img src="../images/home/service-1.png" alt="袋裝香辛料">
          </div>
          <div class="catering-card__content">
            <h3 class="catering-card__title">袋裝香辛料</h3>
            <p class="catering-card__desc">大包裝設計，適合高用量的餐飲廚房，經濟實惠且品質穩定。</p>
            <a href="#" class="btn catering-card__btn">查看產品</a>
          </div>
        </div>

        <!-- Category 2: Jarred Spices -->
        <div class="catering-card">
          <div class="catering-card__image">
            <img src="../images/home/service-2.png" alt="罐裝香辛料">
          </div>
          <div class="catering-card__content">
            <h3 class="catering-card__title">罐裝香辛料</h3>
            <p class="catering-card__desc">專業廚師首選，保存性佳，使用方便，確保每一次調味都精準完美。</p>
            <a href="#" class="btn catering-card__btn">查看產品</a>
          </div>
        </div>

        <!-- Category 3: Sauces -->
        <div class="catering-card">
          <div class="catering-card__image">
            <img src="../images/home/service-3.png" alt="醬料">
          </div>
          <div class="catering-card__content">
            <h3 class="catering-card__title">醬料系列</h3>
            <p class="catering-card__desc">從經典美式BBQ到異國風味醬料，為您的菜色增添豐富層次。</p>
            <a href="#" class="btn catering-card__btn">查看產品</a>
          </div>
        </div>
      </div>
    </section>

    <!-- Contact CTA -->
    <section class="catering-cta">
      <div class="catering-cta__container">
        <h2 class="catering-cta__title">需要客製化服務？</h2>
        <p class="catering-cta__text">我們提供專業的業務諮詢，協助您找到最適合的產品組合。</p>
        <a href="/contact" class="btn catering-cta__btn">聯繫我們</a>
      </div>
    </section>
  </main>

  <!-- footer -->
  <div id="footer"></div>

  <script>
    Promise.all([
      // HTML 模板
      fetch('./layout/header.html').then(response => response.text()),
      fetch('./layout/footer.html').then(response => response.text()),
      // JavaScript 檔案
      fetch('../js/header.js').then(response => response.text()),
    ])
      .then(([headerHtml, footerHtml, headerJs]) => {
        // 1. 插入 HTML
        document.getElementById('header').innerHTML = headerHtml;
        document.getElementById('footer').innerHTML = footerHtml;

        // 2. 執行 JavaScript
        const headerFunc = new Function(headerJs);
        headerFunc();

        console.log('✅ Catering page loaded successfully!');
      })
      .catch(error => console.error('Error loading components:', error));
  </script>
</body>

</html>
