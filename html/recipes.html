<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美味食譜 - Recipes</title>
  <link rel="icon" type="image/png" href="../images/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&display=swap" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/recipes/index.css">
</head>

<body>
  <!-- header -->
  <div id="header"></div>

  <main class="main-content recipes-section">
    <!-- Hero Banner -->
    <div class="hero-banner recipes__banner">
      <img class="hero-banner__bg" src="../images/recipes/recipes-bg.jpg" alt="" data-parallax="0.3">
      <h1 class="hero-banner__title">Recipes</h1>
      <p class="hero-banner__subtitle">美味食譜</p>
    </div>

    <h1 class="page-title recipes__title">食譜</h1>

    <!-- Search Filter Bar -->
    <div class="recipes__filter">
      <div class="recipes__filter-container">
        <div class="recipes__filter-input">
          <input type="text" placeholder="輸入食譜關鍵字">
        </div>
        <div class="recipes__filter-select">
          <div class="multiselect" data-placeholder="產品系列">
            <div class="multiselect__trigger">
              <span class="multiselect__label">產品系列</span>
              <div class="multiselect__arrow"></div>
            </div>
            <div class="multiselect__dropdown">
              <label class="multiselect__option">
                <input type="checkbox" value="single">
                <span>單方香辛料</span>
              </label>
              <label class="multiselect__option">
                <input type="checkbox" value="compound">
                <span>複方香辛料</span>
              </label>
              <label class="multiselect__option">
                <input type="checkbox" value="grinder">
                <span>自磨香辛料</span>
              </label>
            </div>
          </div>
        </div>
        <div class="recipes__filter-select">
          <div class="multiselect" data-placeholder="單方香辛料">
            <div class="multiselect__trigger">
              <span class="multiselect__label">單方香辛料</span>
              <div class="multiselect__arrow"></div>
            </div>
            <div class="multiselect__dropdown">
              <label class="multiselect__option">
                <input type="checkbox" value="pepper">
                <span>胡椒</span>
              </label>
              <label class="multiselect__option">
                <input type="checkbox" value="pepper">
                <span>很多東西啦啦啦了</span>
              </label>
              <label class="multiselect__option">
                <input type="checkbox" value="basil">
                <span>羅勒</span>
              </label>
              <label class="multiselect__option">
                <input type="checkbox" value="oregano">
                <span>奧勒岡</span>
              </label>
              <label class="multiselect__option">
                <input type="checkbox" value="pepper">
                <span>生年肉麵麵米長</span>
              </label>
            </div>
          </div>
        </div>
        <button type="button" class="recipes__filter-btn">搜尋</button>
      </div>
    </div>

    <!-- Recipes Grid -->
    <section class="recipes-list">
      <div class="recipes-list__container">
        <!-- Recipe Cards will be injected here by JS -->
      </div>

      <div class="recipes-list__more">
        <div class="btn more_btn">載入更多</div>
      </div>
    </section>
    <img class="page-bg" src="../images/bgImage/bg-recipe.png" alt="">
  </main>

  <!-- footer -->
  <div id="footer"></div>

  <script>
    function initMultiselects() {
      const multiselects = document.querySelectorAll('.multiselect')

      multiselects.forEach(ms => {
        const trigger = ms.querySelector('.multiselect__trigger')
        const label = ms.querySelector('.multiselect__label')
        const checkboxes = ms.querySelectorAll('input[type="checkbox"]')
        const placeholder = ms.dataset.placeholder

        trigger.addEventListener('click', () => {
          const isOpen = ms.classList.contains('is-open')
          document.querySelectorAll('.multiselect.is-open').forEach(other => other.classList.remove('is-open'))
          if (!isOpen) ms.classList.add('is-open')
        })

        checkboxes.forEach(cb => {
          cb.addEventListener('change', () => {
            const selected = [...checkboxes].filter(c => c.checked).map(c => c.nextElementSibling.textContent)
            label.textContent = selected.length ? selected.join('、') : placeholder
            label.classList.toggle('has-selection', selected.length > 0)
          })
        })
      })

      document.addEventListener('click', e => {
        if (!e.target.closest('.multiselect')) {
          document.querySelectorAll('.multiselect.is-open').forEach(ms => ms.classList.remove('is-open'))
        }
      })
    }

    initMultiselects()
  </script>

  <script>
    Promise.all([
      // HTML 模板
      fetch('./layout/header.html').then(response => response.text()),
      fetch('./layout/footer.html').then(response => response.text()),
      // JavaScript 檔案
      fetch('../js/header.js').then(response => response.text()),
      fetch('../js/recipes/recipes-list.js').then(response => response.text()),
      fetch('../js/utils/parallax.js').then(response => response.text()),
    ])
      .then(([headerHtml, footerHtml, headerJs, recipesJs, parallaxJs]) => {
        // 1. 插入 HTML
        document.getElementById('header').innerHTML = headerHtml;
        document.getElementById('footer').innerHTML = footerHtml;

        // 2. 執行 JavaScript
        const headerFunc = new Function(headerJs);
        headerFunc();

        const recipesFunc = new Function(recipesJs);
        recipesFunc();

        // 3. 初始化視差效果
        const parallaxFunc = new Function(parallaxJs);
        parallaxFunc();

        console.log('✅ Recipes page loaded successfully!');
      })
      .catch(error => console.error('Error loading components:', error));
  </script>
</body>

</html>
