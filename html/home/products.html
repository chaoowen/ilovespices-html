<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單方香辛料 - Single Spice</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <!-- Section Styles -->
  <link rel="stylesheet" href="../../css/home/products.css">
</head>

<body>
  <!-- Single Spice Section -->
  <section class="single-spice">
    <!-- Background Hero Image -->
    <div class="single-spice__hero">
      <img src="../../images/home/cover-2.png" alt="Single Spice Hero">
    </div>

    <!-- Tab Navigation -->
    <nav class="single-spice__tabs" role="tablist">
      <button class="single-spice__tab active" role="tab" aria-selected="true" data-category="white-label">
        白牌式系列
      </button>
      <button class="single-spice__tab" role="tab" aria-selected="false" data-category="herbary">
        草方香辛料
      </button>
      <button class="single-spice__tab" role="tab" aria-selected="false" data-category="compound">
        複方香辛料
      </button>
      <button class="single-spice__tab" role="tab" aria-selected="false" data-category="research">
        努爾斯特調
      </button>
    </nav>

    <!-- Content Container -->
    <div class="single-spice__container">
      <!-- Section Title -->
      <div class="single-spice__header">
        <h2 class="single-spice__title">Single Spice</h2>
        <p class="single-spice__subtitle">單方香辛料</p>
      </div>

      <!-- Swiper Carousel -->
      <div class="single-spice__carousel">
        <div class="swiper single-spice-swiper">
          <div class="swiper-wrapper">
            <!-- Product Cards 由 JS 動態生成 -->
          </div>

          <!-- Navigation Arrows -->
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>

          <!-- Pagination Dots -->
          <div class="swiper-pagination"></div>
        </div>
      </div>

      <!-- View More Button -->
      <a href="/products" class="btn single-spice__btn">更多</a>
    </div>
  </section>

  <!-- JS 由 index.html 統一載入：products.js -> swiper.js -->
</body>

</html>
