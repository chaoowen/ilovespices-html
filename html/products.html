<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products Layout</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/products/index.css">

  <!-- Antonio 字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&display=swap" rel="stylesheet">

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <!-- External CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../../css/products/index.css">

</head>

<body>
  <!-- header -->
  <div id="header"></div>

  <section class="products-section">
    <div class="products-headline">
      <div class="hero-banner products__banner">
        <h2 class="hero-banner__title">Products</h2>
        <p class="hero-banner__subtitle">產品介紹</p>
      </div>

      <div class="products__container">
        <!-- 桌面版 Grid -->
        <ul class="products__row products__row--grid"></ul>
        <!-- 平板/手機版 Swiper -->
        <div class="products__carousel">
          <div class="swiper products-row-swiper">
            <ul class="swiper-wrapper products__swiper-content"></ul>
          </div>
          <div class="products__nav-prev"></div>
          <div class="products__nav-next"></div>
        </div>
      </div>
      <div class="products__container--bg"></div>
    </div>

    <div class="products__options">
      <p class="products__options-result">顯示 1–12 筆 | 總計 45 筆結果</p>
      <div class="products__options-group">
        <div class="select-wrapper">
          <select name="sort_by" class="form-select">
            <option selected value="popularity_desc">熱門程度優先</option>
            <option value="date_asc">新到舊</option>
          </select>
          <div class="select-arrow"></div>
        </div>
        <div>
          <img src="../images/icons/list.svg" alt="">
        </div>
        <div>
          <img src="../images/icons/grid.svg" alt="">
        </div>
      </div>
    </div>
    <div class="products__list"></div>

    <div class="btn products__list-more-btn">載入更多</div>
  </section>

  <!-- footer -->
  <div id="footer"></div>
</body>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  Promise.all([
    // HTML 模板
    fetch('./layout/header.html').then(response => response.text()),
    fetch('./layout/footer.html').then(response => response.text()),
    // JavaScript 檔案
    fetch('../js/header.js').then(response => response.text()),
    fetch('../js/products/product-row.js').then(response => response.text()),
    fetch('../js/utils/swiper-init.js').then(response => response.text()),
    fetch('../js/products/swiper-config.js').then(response => response.text()),
    fetch('../js/products/product-list.js').then(response => response.text()),
  ])
    .then(([headerHtml, footerHtml, headerJs, productRowJs, swiperInitJs, swiperConfigJs, productListJs]) => {
      // 1. 先插入 HTML
      document.getElementById('header').innerHTML = headerHtml;
      document.getElementById('footer').innerHTML = footerHtml;

      // 2. 執行 JavaScript
      const headerFunc = new Function(headerJs);
      headerFunc();

      // 3. 生成產品列表
      const productRowFunc = new Function(productRowJs);
      productRowFunc();

      // 4. 初始化 Swiper 共用工具
      const swiperInitFunc = new Function(swiperInitJs);
      swiperInitFunc();

      // 5. 設定並初始化 Swiper
      const swiperConfigFunc = new Function(swiperConfigJs);
      swiperConfigFunc();

      // 6. 生成下方產品列表
      const productListFunc = new Function(productListJs);
      productListFunc();

      console.log('✅ Products page loaded successfully!');
    })
</script>

</html>
