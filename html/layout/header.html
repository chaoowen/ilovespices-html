<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header</title>
</head>

<body>
  <header class="header">
    <div class="header__container">
      <!-- Logo Section -->
      <div class="header__logo-section">
        <a href="/" class="header__logo" aria-label="McCormick 味好美首頁">
          <img src="../images/logo.png" alt="McCormick 味好美 Logo">
        </a>

        <!-- Mobile Menu Toggle -->
        <button class="header__mobile-toggle" id="mobileMenuToggle" aria-label="開啟選單" aria-expanded="false">
          ☰
        </button>
      </div>

      <!-- Navigation Menu -->
      <nav class="header__nav" id="mainNav" role="navigation" aria-label="主選單">
        <ul class="header__nav-list">
          <li class="header__nav-item">
            <a href="/products" class="header__nav-link">產品介紹</a>
          </li>
          <li class="header__nav-separator" aria-hidden="true">|</li>
          <li class="header__nav-item">
            <a href="/catering" class="header__nav-link">餐飲業務</a>
          </li>
          <li class="header__nav-separator" aria-hidden="true">|</li>
          <li class="header__nav-item">
            <a href="/recipes" class="header__nav-link">美味食譜</a>
          </li>
          <li class="header__nav-separator" aria-hidden="true">|</li>
          <li class="header__nav-item">
            <a href="/food-safety" class="header__nav-link">食安專區</a>
          </li>
          <li class="header__nav-separator" aria-hidden="true">|</li>
          <li class="header__nav-item">
            <a href="/faq" class="header__nav-link">常見問題</a>
          </li>
          <li class="header__nav-separator" aria-hidden="true">|</li>
          <li class="header__nav-item">
            <a href="/about" class="header__nav-link">關於我們</a>
          </li>
          <li class="header__nav-separator" aria-hidden="true">|</li>
          <li class="header__nav-item">
            <a href="/contact" class="header__nav-link">聯繫我們</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>
</body>

</html>
